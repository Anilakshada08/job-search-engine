[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Multi-agent Angular job search, ATS resume tailoring and daily reporting engine"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
